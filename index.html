<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nova-X — Coming Soon</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05020b;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.wrap{position:relative;z-index:2;height:100%;display:grid;place-items:center;text-align:center;padding:24px}.card{max-width:800px}.logo{font-size:clamp(58px,11vw,130px);font-weight:800;letter-spacing:-.07em;background:linear-gradient(90deg,#fff,#d98cff,#9b4dff,#fff);-webkit-background-clip:text;color:transparent;text-shadow:0 0 45px #9b4dff66}.tag{font-size:clamp(20px,3vw,32px);letter-spacing:.08em;text-transform:uppercase;color:#d9c2ff;margin-top:-8px}.desc{margin:24px auto 0;max-width:650px;font-size:18px;line-height:1.7;color:#b9aac9}.pill{display:inline-block;margin-top:30px;padding:12px 22px;border:1px solid #9b4dff66;border-radius:999px;background:#9b4dff12;color:#dcbcff;box-shadow:0 0 30px #9b4dff22}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#b45cff;box-shadow:0 0 15px #b45cff;margin-right:9px;animation:p 1.5s infinite}@keyframes p{50%{opacity:.3;transform:scale(.7)}}
</style></head><body><canvas id="c"></canvas><main class="wrap"><section class="card"><div class="logo">Nova-X</div><div class="tag">Your Personal AI Assistant</div><p class="desc">Something intelligent is coming. Nova-X is being built to become your personal AI companion — powerful, fast, and always ready to help.</p><div class="pill"><span class="dot"></span>Nova-X will be ready soon</div></section></main><script>
const c=document.getElementById('c'),x=c.getContext('2d');let w,h,d=[],n=120;function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w=innerWidth;h=innerHeight;d=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*2+0.4,a:Math.random()*.7+.2}))}addEventListener('resize',resize);resize();function draw(){x.clearRect(0,0,w,h);let g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*.65);g.addColorStop(0,'#18052d');g.addColorStop(1,'#05020b');x.fillStyle=g;x.fillRect(0,0,w,h);for(const p of d){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=`rgba(180,92,255,${p.a})`;x.shadowBlur=14;x.shadowColor='#9b4dff';x.fill()}for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){let a=d[i],b=d[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);if(dist<105){x.strokeStyle=`rgba(155,77,255,${.12*(1-dist/105)})`;x.lineWidth=.6;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}requestAnimationFrame(draw)}draw();
</script></body></html>
