<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA — Your AI Workspace</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#09090b;color:#f4f4f5;min-height:100vh}main{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:30px}.app{width:min(1100px,100%);min-height:650px;border:1px solid #27272a;border-radius:24px;background:#111113;box-shadow:0 20px 80px #0008;display:grid;grid-template-columns:210px 1fr;overflow:hidden}.side{border-right:1px solid #27272a;padding:22px 14px}.brand{font-weight:800;font-size:20px;margin:4px 10px 22px}.nav{width:100%;text-align:left;background:transparent;border:0;color:#a1a1aa;padding:12px 10px;border-radius:10px;cursor:pointer;font-size:14px}.nav:hover,.nav.active{background:#27272a;color:#fff}.workspace{position:relative;display:flex;flex-direction:column}.scene{position:absolute;inset:0;pointer-events:none;opacity:.25}.orb{position:absolute;width:240px;height:240px;border-radius:50%;left:50%;top:35%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff 0,#71717a 8%,#27272a 35%,transparent 68%);filter:blur(1px);box-shadow:0 0 80px #71717a55}.content{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}.top{padding:25px 28px;border-bottom:1px solid #27272a}.top h1{margin:0;font-size:25px}.top p{margin:7px 0 0;color:#71717a;font-size:13px}.messages{flex:1;overflow:auto;padding:28px}.msg{max-width:78%;padding:12px 15px;border-radius:14px;margin:10px 0;line-height:1.5;white-space:pre-wrap}.msg.user{margin-left:auto;background:#27272a}.msg.nova{background:#18181b;border:1px solid #27272a}.typing{opacity:.65}.composer{padding:18px;border-top:1px solid #27272a;display:flex;gap:10px}.composer input{flex:1;background:#18181b;border:1px solid #3f3f46;color:#fff;border-radius:12px;padding:13px 14px;outline:none}.composer button{background:#fff;color:#09090b;border:0;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer}.upload{padding:0 18px 12px}.upload input{display:none}.upload label{display:inline-block;color:#a1a1aa;font-size:12px;cursor:pointer}.bottom{height:70px;display:flex;align-items:center;justify-content:center;color:#71717a;font-size:12px}.hint kbd{border:1px solid #3f3f46;border-radius:5px;padding:2px 5px}.panel{position:absolute;right:22px;top:22px;width:270px;background:#18181b;border:1px solid #3f3f46;border-radius:14px;padding:16px;z-index:3;display:none}.panel.show{display:block}.panel h3{margin:0 0 7px}.panel p{color:#a1a1aa;font-size:13px;line-height:1.45}.panel button{border:1px solid #3f3f46;background:#27272a;color:#fff;padding:8px 10px;border-radius:8px;cursor:pointer}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<main>
<div class="app">
<aside class="side">
<div class="brand">NOVA</div>
<button class="nav active" data-tool="Core">Core</button>
<button class="nav" data-tool="Learn">Learn</button>
<button class="nav" data-tool="Documents">Documents</button>
<button class="nav" data-tool="Research">Research</button>
<button class="nav" data-tool="Writer">Writer</button>
<button class="nav" data-tool="Create">Create</button>
<button class="nav" data-tool="Code">Code</button>
<button class="nav" data-tool="Analyze">Analyze</button>
<button class="nav" data-tool="Mail">Mail</button>
<button class="nav" data-tool="Settings">Settings</button>
</aside>
<section class="workspace">
<div id="scene" class="scene"><div class="orb"></div></div>
<div class="content">
<header class="top"><h1>Your AI Workspace</h1><p>Ask NOVA anything and let the workspace organize around you.</p></header>
<div id="messages" class="messages"></div>
<form id="form" class="composer"><input id="input" autocomplete="off" placeholder="Ask NOVA anything…"><button type="submit">Send</button></form>
</div>
<div id="panel" class="panel"><h3 id="panelTitle">NOVA Core</h3><p id="panelText"></p><button id="panelAction"></button></div>
</section>
</div>
</main>
<div class="upload"><input id="file" type="file" accept=".txt,.md,.csv,.json,.pdf"><label for="file">＋ Add file</label></div>
<footer class="bottom"><div class="hint">NOVA — Your AI Workspace · <kbd>Enter</kbd> to talk</div></footer>
<script>
const messages=document.getElementById('messages'),input=document.getElementById('input'),form=document.getElementById('form'),panel=document.getElementById('panel'),panelTitle=document.getElementById('panelTitle'),panelText=document.getElementById('panelText'),panelAction=document.getElementById('panelAction'),scene=document.getElementById('scene');
const history=[];let currentTool='Core';let fileContext='';
const descriptions={Core:['Your workspace intelligence. Ask NOVA anything and let the workspace organize around you.','Start with NOVA'],Learn:['Turn questions and documents into lessons, explanations, examples, flashcards and quizzes.','Teach me something'],Documents:['Bring files into the workspace. Text-based files can be read directly in this V2 build.','Add a file'],Research:['Plan research, compare supplied information and turn findings into organized notes.','Start research'],Writer:['Draft, rewrite, summarize or structure your writing with NOVA.','Open Writer'],Create:['Brainstorm visual concepts, content, presentations, videos and creative ideas.','Start creating'],Code:['Work through code, errors, architecture and project ideas with NOVA.','Open Code'],Analyze:['Explore data, calculations, tables, patterns and reports from supplied information.','Analyze data'],Mail:['Prepare email drafts and organize your inbox workflow. Sending requires a real integration and approval.','Draft an email'],Settings:['Configure NOVA workspace behavior and AI settings.','Open settings']};
function add(text,who='nova'){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d}
function selectTool(tool){currentTool=tool;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));panelTitle.textContent='NOVA '+tool;panelText.textContent=descriptions[tool][0];panelAction.textContent=descriptions[tool][1];panel.classList.add('show');scene.classList.add('active');if(tool!=='Core')add(`Workspace switched to ${tool}. Tell NOVA what you want to do.`)}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>selectTool(b.dataset.tool)));
panelAction.addEventListener('click',()=>{if(currentTool==='Documents')document.getElementById('file').click();else{input.value=panelAction.textContent;input.focus()}});
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;add(text,'user');input.value='';const typing=add('NOVA is thinking…','nova');typing.classList.add('typing');history.push({role:'user',content:text});try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,workspace:currentTool,context:fileContext})});const data=await r.json();if(!r.ok){const details=Array.isArray(data.details)?'\n\n'+data.details.join('\n'):'';const hint=data.hint?`\n\n${data.hint}`:'';throw new Error((data.error||`Request failed (${r.status})`)+details+hint)}typing.remove();add(data.message||'I received an empty response.','nova');history.push({role:'assistant',content:data.message||''})}catch(err){typing.remove();add('NOVA ERROR:\n'+(err.message||String(err)),'nova');console.error(err)}});
async function readFile(file){if(file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')){add(`📄 ${file.name} was added. Browser PDF extraction needs a PDF parser integration; the file is ready for the Documents pipeline.`,'user');return}try{const text=await file.text();fileContext=`File: ${file.name}\n\n${text.slice(0,30000)}`;add(`📄 ${file.name} is loaded. I can now use its text as context for your next question.`,'user');selectTool('Documents')}catch(e){add(`I added ${file.name}, but could not read its text in the browser.`,'nova')}}
document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;await readFile(f);e.target.value='' });
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script>
</body></html>
