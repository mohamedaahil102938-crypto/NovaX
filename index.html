<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07030f">
<title>NOVA — Your AI Workspace</title>
<style>
:root{--p:#a45cff;--p2:#e0b8ff;--bg:#05020b;--panel:#0b0612;--line:rgba(204,151,255,.22);--text:#fbf8ff;--muted:#9f91ad}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit}button{color:inherit}.app{position:fixed;inset:0;width:100%;height:100dvh;background:radial-gradient(circle at 50% 0%,#32105e 0,transparent 34%),radial-gradient(circle at 0 100%,#18082c 0,transparent 30%),#05020b;display:flex;flex-direction:column}.stars{position:absolute;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(circle,rgba(255,255,255,.65) 0 1px,transparent 1.5px),radial-gradient(circle,rgba(190,125,255,.3) 0 1px,transparent 1.5px);background-size:87px 103px,151px 163px}.top{height:68px;min-height:68px;padding:0 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:rgba(7,3,15,.72);backdrop-filter:blur(14px);z-index:5}.brand{display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:13px;background:radial-gradient(circle at 34% 27%,#fff 0 5%,#efd7ff 7%,#bd70ff 16%,#7730ee 35%,#1c0835 68%,transparent 72%);box-shadow:0 0 20px #a45cff}.brand strong{font-size:19px;letter-spacing:.16em}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em;margin-top:2px}.status{font-size:10px;color:#d9c9e7;letter-spacing:.08em}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#d3a0ff;box-shadow:0 0 10px #b76cff;margin-right:6px}.chat{position:relative;z-index:2;flex:1;min-height:0;width:100%;display:flex;flex-direction:column}.messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:34px max(18px,calc((100vw - 920px)/2)) 170px;scroll-behavior:smooth}.welcome{min-height:55%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.welcomeOrb{width:94px;height:94px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff 0 4%,#efd8ff 8%,#c074ff 17%,#7027d6 45%,#1d0835 70%);box-shadow:0 0 35px #9b5cff,0 0 100px #7d35ff44;margin-bottom:22px}.welcome h1{font-size:clamp(30px,5vw,48px);margin:0;background:linear-gradient(100deg,#fff,#d6adff,#9c55ff,#fff);-webkit-background-clip:text;color:transparent;letter-spacing:.02em}.welcome p{max-width:560px;font-size:13px;line-height:1.7;color:#9f91aa;margin:10px 0 22px}.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:700px}.chip{border:1px solid #c997ff33;background:#a45cff0d;color:#d9cce2;border-radius:999px;padding:9px 13px;font-size:10px;cursor:pointer}.chip:hover{border-color:#c38aff;background:#a45cff16}.msg{display:flex;gap:10px;margin:0 auto 18px;max-width:920px;animation:appear .18s ease}.msg.user{justify-content:flex-end}.bubble{max-width:min(780px,86vw);padding:13px 16px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:13px}.nova .bubble{background:rgba(35,18,54,.86);border:1px solid var(--line)}.user .bubble{background:linear-gradient(145deg,#8647d6,#55209b);border:1px solid #d0a1ff44}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:radial-gradient(circle at 35% 28%,#fff,#c074ff 18%,#7027d6 45%,#1d0835 70%);box-shadow:0 0 12px #9b5cff55}.typing{opacity:.65}.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#d2a0ff;margin:0 2px;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{50%{opacity:.2;transform:translateY(-2px)}}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}.composerArea{position:absolute;left:0;right:0;bottom:0;padding:18px max(18px,calc((100vw - 920px)/2));padding-bottom:max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(5,2,11,.96) 25%,#05020b 100%)}.composer{display:flex;align-items:flex-end;gap:8px;padding:7px;border:1px solid #c997ff4a;border-radius:20px;background:rgba(16,8,26,.94);box-shadow:0 15px 45px #0009}.composer:focus-within{border-color:#bd82ff;box-shadow:0 15px 50px #000b,0 0 25px #8d46ff18}.composer textarea{min-width:0;flex:1;resize:none;overflow-y:auto;max-height:180px;min-height:46px;background:transparent;border:0;outline:0;color:#fff;padding:11px 12px;font-size:14px;line-height:21px}.composer textarea::placeholder{color:#80738d}.iconBtn,.send{border-radius:13px;cursor:pointer}.iconBtn{width:42px;height:42px;flex:0 0 42px;border:1px solid var(--line);background:#ffffff05;color:#cbb5db}.iconBtn:hover{border-color:#c38aff}.send{width:44px;height:44px;flex:0 0 44px;border:0;color:#fff;background:linear-gradient(135deg,#b36aff,#6422c6);box-shadow:0 0 18px #8d46ff55}.send:disabled{opacity:.5;cursor:wait}.tools{display:flex;justify-content:space-between;margin:7px 4px 0;color:#70647a;font-size:9px}.bottom{height:27px;min-height:27px;border-top:1px solid #be82ff12;display:flex;align-items:center;justify-content:center;color:#62576b;font-size:8px;letter-spacing:.06em;background:#05020b}input[type=file]{display:none}@media(max-width:650px){.top{height:60px;min-height:60px;padding:0 15px}.brand strong{font-size:16px}.brand small{font-size:8px}.logo{width:36px;height:36px}.status{font-size:9px}.messages{padding:20px 12px 155px}.welcome{min-height:60%;padding:15px}.welcomeOrb{width:72px;height:72px;margin-bottom:17px}.welcome p{font-size:11px}.bubble{font-size:12px;max-width:88vw;padding:11px 13px}.composerArea{padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}.composer{border-radius:17px}.composer textarea{font-size:13px;min-height:43px}.iconBtn{width:39px;height:39px;flex-basis:39px}.send{width:41px;height:41px;flex-basis:41px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
<div class="stars"></div>
<header class="top">
<div class="brand"><div class="logo"></div><div><strong>NOVA</strong><small>YOUR AI WORKSPACE</small></div></div>
<div class="status"><span class="dot"></span>ONLINE</div>
</header>
<main class="chat">
<div id="messages" class="messages">
<section id="welcome" class="welcome">
<div class="welcomeOrb"></div>
<h1>How can I help?</h1>
<p>NOVA is ready. Ask anything, work through an idea, write something, analyze a problem, or build code.</p>
<div class="chips">
<button class="chip" data-prompt="Explain something to me simply">Explain something</button>
<button class="chip" data-prompt="Help me research a topic">Research a topic</button>
<button class="chip" data-prompt="Help me write something">Write something</button>
<button class="chip" data-prompt="Help me build a coding project">Build with code</button>
</div>
</section>
</div>
<div class="composerArea">
<form id="form" class="composer">
<label class="iconBtn" title="Attach a file"><input id="file" type="file" accept=".txt,.md,.csv,.json,.pdf">📎</label>
<textarea id="input" rows="1" placeholder="Message NOVA..." autocomplete="off"></textarea>
<button id="send" class="send" type="submit" aria-label="Send">➤</button>
</form>
<div class="tools"><span id="fileName">No file attached</span><span>Enter to send · Shift+Enter for new line</span></div>
</div>
</main>
<footer class="bottom">NOVA — AI, BUT IN YOUR WORLD.</footer>
</div>
<script>
const messages=document.getElementById('messages');
const welcome=document.getElementById('welcome');
const form=document.getElementById('form');
const input=document.getElementById('input');
const send=document.getElementById('send');
const fileInput=document.getElementById('file');
const fileName=document.getElementById('fileName');
let history=[];let fileContext='';let sending=false;
function addMessage(role,text){
 welcome.style.display='none';
 const row=document.createElement('div');row.className='msg '+role;
 if(role==='nova'){const av=document.createElement('div');av.className='avatar';row.appendChild(av)}
 const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;row.appendChild(bubble);messages.appendChild(row);messages.scrollTop=messages.scrollHeight;return row;
}
function addTyping(){const row=document.createElement('div');row.className='msg nova typing';const av=document.createElement('div');av.className='avatar';row.appendChild(av);const b=document.createElement('div');b.className='bubble';b.innerHTML='<i></i><i></i><i></i>';row.appendChild(b);messages.appendChild(row);messages.scrollTop=messages.scrollHeight;return row}
async function sendMessage(){
 if(sending)return;const text=input.value.trim();if(!text)return;
 sending=true;send.disabled=true;input.value='';input.style.height='auto';addMessage('user',text);history.push({role:'user',content:text});const typing=addTyping();
 try{
  const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,workspace:'Core',context:fileContext})});
  let data={};try{data=await res.json()}catch(e){throw new Error('The server returned an invalid response.')}
  typing.remove();if(!res.ok)throw new Error(data.error||data.message||'NOVA could not get a response.');
  const answer=data.message||data.reply||data.content||'I received the request but no answer was returned.';addMessage('nova',answer);history.push({role:'assistant',content:answer});
 }catch(err){typing.remove();addMessage('nova','Sorry — '+err.message);history.pop()}
 finally{sending=false;send.disabled=false;input.focus()}
}
form.addEventListener('submit',e=>{e.preventDefault();sendMessage()});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.prompt;input.focus();input.dispatchEvent(new Event('input'))}));
fileInput.addEventListener('change',async()=>{const f=fileInput.files[0];if(!f)return;fileName.textContent=f.name;fileContext='';if(/\.(txt|md|csv|json)$/i.test(f.name)){try{fileContext=(await f.text()).slice(0,30000);fileName.textContent=f.name+' · ready'}catch(e){fileName.textContent=f.name+' · attached'}}else{fileName.textContent=f.name+' · attached';fileContext='Attached file: '+f.name+' (PDF extraction is not enabled yet).'}});
</script>
</body>
</html>
