<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07030f"><title>NOVA — Your AI Workspace</title><style>
:root{--p:#a45cff;--p2:#e0b8ff;--bg:#05020b;--panel:rgba(13,7,24,.97);--line:rgba(204,151,255,.24);--text:#fbf8ff;--muted:#9f91ad}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea,input{font:inherit}.universe{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 35%,#32105e 0,transparent 34%),#05020b}.stars{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.7) 0 1px,transparent 1.5px),radial-gradient(circle,rgba(190,125,255,.35) 0 1px,transparent 1.5px);background-size:87px 103px,151px 163px;opacity:.7}.app{position:relative;z-index:2;width:100vw;height:100dvh;display:flex;flex-direction:column;background:#05020bcc}.top{height:66px;min-height:66px;padding:0 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#fff1;z-index:50}.brand{display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:13px;background:radial-gradient(circle at 34% 27%,#fff 0 5%,#efd7ff 7%,#bd70ff 16%,#7730ee 35%,#1c0835 68%,transparent 72%);box-shadow:0 0 20px #a45cff}.brand strong{font-size:19px;letter-spacing:.16em}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em}.topRight{display:flex;align-items:center;gap:9px}.state{font-size:10px;color:#d9c9e7}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#d3a0ff;box-shadow:0 0 10px #b76cff;margin-right:6px}.main{position:relative;flex:1;min-height:0;display:flex;overflow:hidden}.chat{width:100%;height:100%;display:flex;flex-direction:column}.messages{flex:1;min-height:0;overflow:auto;padding:34px max(18px,calc((100vw - 900px)/2)) 150px}.welcome{text-align:center;max-width:760px;margin:7vh auto 0}.welcomeOrb{width:86px;height:86px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff,#c074ff 17%,#7027d6 45%,#1d0835 70%);box-shadow:0 0 32px #9b5cff}.welcome h1{font-size:clamp(30px,5vw,48px);margin:0;background:linear-gradient(100deg,#fff,#d6adff,#9c55ff,#fff);-webkit-background-clip:text;color:transparent}.welcome p{font-size:13px;line-height:1.7;color:#9f91aa;margin:10px auto 20px;max-width:620px}.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.chip,.tool{border:1px solid #c997ff33;background:#a45cff0d;color:#d9cce2;border-radius:999px;padding:9px 13px;font-size:10px;cursor:pointer}.chip:hover,.tool:hover{border-color:#c38aff;background:#a45cff18}.msg{display:flex;gap:9px;margin:0 auto 15px;max-width:900px}.msg.user{justify-content:flex-end}.bubble{max-width:min(78%,760px);padding:12px 15px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:13px}.nova .bubble{background:#231236e6;border:1px solid var(--line)}.user .bubble{background:linear-gradient(145deg,#8647d6,#55209b);border:1px solid #d0a1ff44}.avatar{width:29px;height:29px;flex:0 0 29px;border-radius:9px;background:radial-gradient(circle at 35% 28%,#fff,#c074ff 18%,#7027d6 45%,#1d0835 70%);box-shadow:0 0 12px #9b5cff55}.typing{opacity:.65}.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#d2a0ff;margin:0 2px;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{50%{opacity:.2;transform:translateY(-2px)}}.composerWrap{position:absolute;left:0;right:0;bottom:0;padding:14px max(18px,calc((100vw - 900px)/2));background:linear-gradient(transparent,#05020b 24%)}.composer{display:flex;align-items:flex-end;gap:7px;padding:6px;border:1px solid #c997ff4a;border-radius:18px;background:#10081af2;box-shadow:0 15px 45px #0009}.composer:focus-within{border-color:#bd82ff;box-shadow:0 0 25px #8d46ff18}.composer textarea{min-width:0;flex:1;resize:none;overflow-y:auto;max-height:150px;min-height:44px;background:transparent;border:0;outline:0;color:#fff;padding:11px;font-size:13px;line-height:20px}.composer textarea::placeholder{color:#80738d}.iconBtn,.send{border-radius:12px;cursor:pointer}.iconBtn{width:42px;height:42px;flex:0 0 42px;border:1px solid var(--line);background:#ffffff05;color:#cbb5db}.send{width:44px;height:44px;flex:0 0 44px;border:0;color:#fff;background:linear-gradient(135deg,#b36aff,#6422c6);box-shadow:0 0 16px #8d46ff55}.send:disabled{opacity:.5;cursor:wait}.tools{display:flex;justify-content:space-between;margin:7px 3px 0;color:#70647a;font-size:8px}.tool{border:0;padding:4px 7px;background:transparent;color:#887993}.attachment{display:none}.toast{position:absolute;left:50%;top:78px;transform:translate(-50%,-15px);opacity:0;pointer-events:none;z-index:80;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#12091def;color:#dfd0e8;font-size:10px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.mediaCard{max-width:900px;margin:10px auto 18px;border:1px solid var(--line);border-radius:16px;background:#10081ae8;padding:14px}.mediaCard h3{margin:0 0 8px;font-size:13px}.mediaCard p{color:#a99ab8;font-size:11px;margin:0 0 12px;line-height:1.5}.mediaBtns{display:flex;gap:7px;flex-wrap:wrap}.mediaBtns button{border:1px solid var(--line);background:#a45cff0c;color:#ddd0e7;border-radius:10px;padding:8px 10px;font-size:10px;cursor:pointer}.mediaPreview{max-width:100%;max-height:360px;border-radius:12px;margin-top:10px;display:none}.hidden{display:none!important}
@media(max-width:650px){.top{height:58px;min-height:58px;padding:0 12px}.brand strong{font-size:15px}.brand small{font-size:7px}.state{display:none}.messages{padding:22px 12px 145px}.welcome{margin-top:6vh}.welcomeOrb{width:70px;height:70px}.welcome p{font-size:11px}.bubble{max-width:88%;font-size:12px}.composerWrap{padding:10px 10px}.composer textarea{font-size:12px}.iconBtn{width:38px;height:38px;flex-basis:38px}.send{width:40px;height:40px;flex-basis:40px}}
</style></head><body><div class="universe"><div class="stars"></div><div class="app"><header class="top"><div class="brand"><div class="logo"></div><div><strong>NOVA</strong><small>YOUR AI WORKSPACE</small></div></div><div class="topRight"><div class="state"><span class="dot"></span>CORE ONLINE</div></div></header><main class="main"><section class="chat"><div id="messages" class="messages"><div id="welcome" class="welcome"><div class="welcomeOrb"></div><h1>NOVA</h1><p>AI, but in your world. Ask anything, create images, work with your photos, generate ideas, write, code, research and more.</p><div class="chips"><button class="chip" data-prompt="Create an image of a futuristic purple city at night">🎨 Create image</button><button class="chip" data-prompt="Help me research a topic">🧠 Research</button><button class="chip" data-prompt="Teach me something step by step">📚 Learn</button><button class="chip" data-prompt="Help me write something">✍️ Write</button><button class="chip" data-prompt="Help me with code">💻 Code</button></div></div></div><div class="composerWrap"><div class="composer"><label class="iconBtn" title="Upload photo/file"><input id="file" class="attachment" type="file" accept="image/*,.txt,.md,.csv,.json,.pdf,.docx,.xlsx,.xls"><span>＋</span></label><textarea id="input" rows="1" placeholder="Ask NOVA anything... or describe what you want to create"></textarea><button id="send" class="send">➤</button></div><div class="tools"><span id="fileName">NOVA Core • Groq • GPT-OSS-120B</span><button id="clear" class="tool">Clear</button></div></div></section></main><div id="toast" class="toast"></div></div></div><script>
const input=document.getElementById('input'),send=document.getElementById('send'),messages=document.getElementById('messages'),welcome=document.getElementById('welcome'),file=document.getElementById('file'),fileName=document.getElementById('fileName'),toast=document.getElementById('toast');let history=[],fileContext='',imageData='';
function notify(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
function addMessage(role,text){if(welcome)welcome.remove();const row=document.createElement('div');row.className='msg '+(role==='user'?'user':'nova');if(role!=='user'){const av=document.createElement('div');av.className='avatar';row.appendChild(av)}const b=document.createElement('div');b.className='bubble';b.textContent=text;row.appendChild(b);messages.appendChild(row);messages.scrollTop=messages.scrollHeight}
function typing(){const row=document.createElement('div');row.id='typing';row.className='msg nova';row.innerHTML='<div class="avatar"></div><div class="bubble typing"><i></i><i></i><i></i></div>';messages.appendChild(row);messages.scrollTop=messages.scrollHeight}
function mediaCard(kind,prompt){const c=document.createElement('div');c.className='mediaCard';c.innerHTML='<h3>'+kind+'</h3><p>'+prompt.replace(/</g,'&lt;')+'</p><div class="mediaBtns"><button>Generate</button><button>Refine prompt</button><button>Try another</button></div>';c.querySelectorAll('button')[0].onclick=()=>{input.value=prompt;input.focus();notify('Ready — send the prompt to NOVA')};messages.appendChild(c);messages.scrollTop=messages.scrollHeight}
async function loadScript(src){return new Promise((resolve,reject)=>{if(document.querySelector('script[data-nova-lib="'+src+'"]'))return resolve();const s=document.createElement('script');s.src=src;s.async=true;s.dataset.novaLib=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
async function extractDocument(f){const name=f.name.toLowerCase();if(f.type==='application/pdf'||name.endsWith('.pdf')){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');const pdfjs=window.pdfjsLib;if(!pdfjs)throw new Error('PDF reader could not load');const buf=await f.arrayBuffer();const pdf=await pdfjs.getDocument({data:buf}).promise;let out='';for(let p=1;p<=Math.min(pdf.numPages,40);p++){const page=await pdf.getPage(p);const tc=await page.getTextContent();out+='\n--- Page '+p+' ---\n'+tc.items.map(x=>x.str||'').join(' ')}return out.slice(0,60000)}if(name.endsWith('.docx')){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js');if(!window.mammoth)throw new Error('DOCX reader could not load');const r=await window.mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});return r.value.slice(0,60000)}if(name.endsWith('.xlsx')||name.endsWith('.xls')){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');if(!window.XLSX)throw new Error('Spreadsheet reader could not load');const wb=window.XLSX.read(await f.arrayBuffer(),{type:'array'});let out='';wb.SheetNames.forEach(n=>{out+='\n--- Sheet: '+n+' ---\n'+window.XLSX.utils.sheet_to_csv(wb.Sheets[n])});return out.slice(0,60000)}if(f.size<1000000)return (await f.text()).slice(0,60000);return 'Attached file: '+f.name+' (too large for browser text extraction).'}
function resizeImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function sendMessage(text=input.value.trim()){if(!text||send.disabled)return;addMessage('user',text);const userContent=imageData?[{type:'text',text},{type:'image_url',image_url:{url:imageData}}]:text;history.push({role:'user',content:userContent});input.value='';input.style.height='auto';send.disabled=true;typing();try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,workspace:'Core',context:fileContext,capabilities:['chat','image_generation','image_editing','video_generation','vision','files','research','writing','code']})});const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{throw new Error('Server returned an invalid response')}if(!r.ok)throw new Error(data.error||data.message||'NOVA could not get a response');document.getElementById('typing')?.remove();const answer=data.message||data.response||'I could not generate a response.';addMessage('nova',answer);history.push({role:'assistant',content:answer});if(/\b(create|generate|make|edit).*(image|photo|picture)|image.*(prompt|generate|create)/i.test(text)){mediaCard('🎨 Image workspace',imageData?'Photo understood by NOVA. Describe the exact transformation you want and NOVA will use the photo as visual context.':'Image prompt detected. NOVA can prepare the prompt, but a separate image-rendering provider is still needed to produce pixels.')}if(/\b(generate|make|create).*(video)|video.*(generate|create)/i.test(text))mediaCard('🎬 Video workspace','Video prompt detected. A video-rendering provider is still needed to produce the final video.')}catch(e){document.getElementById('typing')?.remove();addMessage('nova','NOVA error: '+e.message);notify('Request failed')}finally{send.disabled=false;input.focus()}}
send.onclick=()=>sendMessage();input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;input.focus()});document.getElementById('clear').onclick=()=>{history=[];fileContext='';imageData='';messages.innerHTML='';location.reload()};file.addEventListener('change',async()=>{const f=file.files[0];if(!f)return;fileName.textContent='Attached: '+f.name;try{if(f.type.startsWith('image/')){imageData=await resizeImage(f);fileContext='The user attached a photo named '+f.name+'. The image itself is being sent to NOVA vision for inspection.';notify('Photo attached — NOVA can see it now.')}else{imageData='';fileContext=await extractDocument(f);notify('Document attached — NOVA can read the extracted content.')}}catch(e){imageData='';fileContext='Attached file: '+f.name;notify('Could not read this file in the browser')}}});
</script></body></html>
