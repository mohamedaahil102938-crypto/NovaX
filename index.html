<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NOVA — Your AI Workspace</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03020a;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}body{background:radial-gradient(circle at 50% 45%,#18062d 0,#080311 42%,#03020a 100%)}button,input{font:inherit}.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}.grid{position:absolute;inset:-30%;background-image:linear-gradient(#9b4dff0d 1px,transparent 1px),linear-gradient(90deg,#9b4dff0d 1px,transparent 1px);background-size:55px 55px;transform:perspective(500px) rotateX(64deg) translateY(12%);animation:grid 18s linear infinite}@keyframes grid{to{background-position:0 55px,55px 0}}.orb{position:absolute;left:50%;top:44%;width:250px;height:250px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff,#dca2ff 7%,#8d38ff 25%,#371060 58%,transparent 72%);filter:drop-shadow(0 0 35px #9b4dff) drop-shadow(0 0 90px #6d22ff);animation:float 4s ease-in-out infinite}.orb:before,.orb:after{content:"";position:absolute;inset:-35px;border:1px solid #bd76ff55;border-radius:50%;transform:rotate(20deg) scaleY(.55);animation:ring 7s linear infinite}.orb:after{inset:-55px;transform:rotate(-25deg) scaleY(.38);animation-duration:10s}@keyframes ring{to{transform:rotate(380deg) scaleY(.55)}}@keyframes float{50%{transform:translate(-50%,-54%) scale(1.035)}}.top{position:fixed;top:0;left:0;right:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid #ffffff0d;background:#05020bcc;backdrop-filter:blur(18px);z-index:5}.brand{font-weight:800;letter-spacing:.18em;color:#eee}.brand span{color:#b96aff}.status{font-size:12px;color:#aa9bb8}.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#b75cff;box-shadow:0 0 12px #b75cff;margin-right:8px}.side{position:fixed;left:20px;top:95px;bottom:95px;width:190px;display:flex;flex-direction:column;gap:8px;z-index:5}.nav{border:1px solid #ffffff0d;background:#0b0713b8;color:#b9aec5;border-radius:13px;padding:12px 14px;text-align:left;cursor:pointer;transition:.2s}.nav:hover,.nav.active{color:#fff;border-color:#9b4dff66;background:#9b4dff18;box-shadow:0 0 22px #9b4dff12}.nav b{display:block;font-size:13px}.nav small{display:block;margin-top:3px;color:#71677b}.workspace{position:fixed;inset:72px 0 78px;z-index:2;pointer-events:none}.panel{pointer-events:auto;position:absolute;right:25px;top:24px;width:330px;min-height:180px;padding:18px;border:1px solid #ffffff12;background:#090611d9;border-radius:18px;backdrop-filter:blur(18px);box-shadow:0 18px 70px #0008;opacity:0;transform:translateX(30px);transition:.3s}.panel.show{opacity:1;transform:translateX(0)}.panel h3{margin:0 0 6px}.panel p{color:#998da5;font-size:13px;line-height:1.55}.panel .action{margin-top:10px;border:1px solid #9b4dff55;background:#9b4dff14;color:#d9baff;border-radius:10px;padding:9px 12px;cursor:pointer}.chat{pointer-events:auto;position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,calc(100% - 40px));height:250px;display:flex;flex-direction:column;gap:10px}.messages{flex:1;overflow:auto;padding:8px 4px;mask-image:linear-gradient(transparent,#000 12%,#000 90%,transparent)}.msg{max-width:78%;padding:11px 14px;border-radius:15px;margin:8px 0;font-size:14px;line-height:1.5;white-space:pre-wrap}.msg.nova{background:#0e0818dd;border:1px solid #9b4dff2e;color:#e9e1ef}.msg.user{margin-left:auto;background:#9b4dff20;border:1px solid #b76aff35;color:#eee}.composer{display:flex;gap:8px;padding:7px;border:1px solid #ffffff16;background:#090511ee;border-radius:16px;box-shadow:0 0 35px #0008}.composer input{flex:1;border:0;outline:0;background:transparent;color:#fff;padding:11px}.composer button{border:1px solid #9b4dff55;background:#9b4dff25;color:#fff;border-radius:11px;padding:0 15px;cursor:pointer}.composer button:hover{background:#9b4dff45}.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;z-index:5;display:flex;align-items:center;justify-content:center;color:#6f6579;font-size:11px;letter-spacing:.08em}.hint{position:absolute;left:26px}.hint kbd{border:1px solid #ffffff1c;border-radius:5px;padding:3px 6px;color:#a99db0}.upload{position:absolute;right:25px;bottom:90px;z-index:6}.upload input{display:none}.upload label{display:block;border:1px solid #ffffff16;background:#090511dd;padding:9px 12px;border-radius:10px;color:#a99caf;cursor:pointer}.typing{opacity:.6}
@media(max-width:800px){.side{left:10px;top:82px;width:58px}.nav{padding:11px;text-align:center}.nav b{font-size:11px}.nav small{display:none}.orb{width:190px;height:190px}.panel{right:10px;width:290px}.chat{width:calc(100% - 100px)}.hint{display:none}}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div><div class="orb"></div></div>
<header class="top"><div class="brand">NOVA <span>✦</span></div><div class="status"><i></i>CORE ONLINE</div></header>
<nav class="side">
<button class="nav active" data-tool="Core"><b>🔵 Core</b><small>AI workspace</small></button>
<button class="nav" data-tool="Learn"><b>📚 Learn</b><small>Study & explain</small></button>
<button class="nav" data-tool="Documents"><b>📄 Documents</b><small>Files & PDFs</small></button>
<button class="nav" data-tool="Research"><b>🔎 Research</b><small>Find & compare</small></button>
<button class="nav" data-tool="Writer"><b>✍️ Writer</b><small>Create text</small></button>
<button class="nav" data-tool="Create"><b>🎨 Create</b><small>Ideas & media</small></button>
<button class="nav" data-tool="Code"><b>💻 Code</b><small>Build software</small></button>
<button class="nav" data-tool="Analyze"><b>📊 Analyze</b><small>Data & charts</small></button>
<button class="nav" data-tool="Mail"><b>✉️ Mail</b><small>Email assistant</small></button>
<button class="nav" data-tool="Settings"><b>⚙️ Settings</b><small>NOVA controls</small></button>
</nav>
<main class="workspace">
<section class="panel" id="panel"><h3 id="panelTitle">NOVA Core</h3><p id="panelText">Your workspace intelligence. Ask NOVA anything and choose a workspace tool to bring it around you.</p><button class="action" id="panelAction">Start with NOVA</button></section>
<section class="chat"><div class="messages" id="messages"><div class="msg nova">Hey 👋 I'm NOVA. I'm online. Try asking me something below.</div></div><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="Ask NOVA anything…"><button type="submit">Send ↗</button></form></section>
</main>
<div class="upload"><input id="file" type="file" accept=".txt,.md,.csv,.json,.pdf"><label for="file">＋ Add file</label></div>
<footer class="bottom"><div class="hint">NOVA — Your AI Workspace · <kbd>Enter</kbd> to talk</div></footer>
<script>
const messages=document.getElementById('messages'),input=document.getElementById('input'),form=document.getElementById('form'),panel=document.getElementById('panel'),panelTitle=document.getElementById('panelTitle'),panelText=document.getElementById('panelText'),panelAction=document.getElementById('panelAction');
const history=[];
const descriptions={Core:['Your workspace intelligence. Ask NOVA anything and let the workspace organize around you.','Start with NOVA'],Learn:['Turn questions and documents into lessons, explanations, flashcards and quizzes.','Teach me something'],Documents:['Bring files into the workspace. V1 accepts files and can use their text as context when available.','Add a file'],Research:['Plan research, compare ideas and turn findings into useful notes.','Start research'],Writer:['Draft, rewrite, summarize or structure your writing with NOVA.','Open Writer'],Create:['Brainstorm visual concepts, content, presentations and creative ideas.','Start creating'],Code:['Work through code, errors and project ideas with NOVA.','Open Code'],Analyze:['Explore data, calculations, tables, patterns and reports.','Analyze data'],Mail:['Prepare email drafts and organize your inbox workflow. Sending will require your approval.','Draft an email'],Settings:['Configure the NOVA workspace and AI behavior.','Open settings']};
function add(text,who='nova'){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d}
function selectTool(tool){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));panelTitle.textContent='NOVA '+tool;panelText.textContent=descriptions[tool][0];panelAction.textContent=descriptions[tool][1];panel.classList.add('show'); if(tool!=='Core') add(`Workspace switched to ${tool}. What do you want NOVA to do?`)}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>selectTool(b.dataset.tool)));
panelAction.addEventListener('click',()=>{if(panelTitle.textContent.includes('Documents'))document.getElementById('file').click();else{input.value=panelAction.textContent;input.focus()}});
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;add(text,'user');input.value='';const typing=add('NOVA is thinking…','nova');typing.classList.add('typing');history.push({role:'user',content:text});try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');typing.remove();add(data.message||'I received an empty response.','nova');history.push({role:'assistant',content:data.message||''})}catch(err){typing.remove();add('I could not reach the NOVA AI engine yet. Check that your four Cerebras keys are added to Vercel as CEREBRAS_API_KEY_1 through CEREBRAS_API_KEY_4.','nova');console.error(err)}});
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;add(`📄 Added ${f.name} to the workspace. V1 has received the file; deeper PDF/document processing will be connected next.`,'user');selectTool('Documents')});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script>
</body></html>
